"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
[](bg:#2d6ac0 fg:#a3aed2)\
$directory\
[](fg:#2d6ac0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$python\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""



[directory]
style = "fg:#ffffff bg:#2d6ac0"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ' 󰌾 ' # nf-md-lock
read_only_style = 'fg:#f7768e bg:#1a1b26'
format = '[ $path ]($style)[$read_only]($read_only_style)'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[character]
success_symbol = '[❯](bold fg:#a3aed2)'  # RGB(163, 174, 210)
error_symbol   = '[❯](bold fg:#f7768e)'  # RGB(247, 118, 142)
vimcmd_symbol  = '[❮](bold fg:#e0af68)'  # RGB(224, 175, 104)

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[git_metrics]
disabled = false
added_style   = 'fg:#9ece6a bg:#394260'  # RGB(158, 206, 106)
deleted_style = 'fg:#f7768e bg:#394260'  # RGB(247, 118, 142)
format = '([ +$added ]($added_style))([ -$deleted ]($deleted_style))'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[python]
symbol = ""
style = "bg:#212736"
# 仮想環境がある場合は () 内に表示する設定
format = '[[ $symbol ($version) ( \($virtualenv\)) ](fg:#769ff0 bg:#212736)]($style)'

[docker_context]
symbol = " "  # お好みの Docker アイコンに
style = "bg:#212736"
format = '[[ $symbol$context ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
